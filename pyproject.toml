[project]
name = "evoteam"
version = "0.1.0"
description = "Evidence-driven multi-agent organization evolution on openJiuwen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openjiuwen>=0.1.17.post1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", ".frontend-slides"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["evoteam", "main.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
